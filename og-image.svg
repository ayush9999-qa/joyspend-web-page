      <stop offset="0%" stop-color="#0B1228"/>
      <stop offset="100%" stop-color="#1C285C"/>
    </linearGradient>
    <linearGradient id="headline" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#93B5FF"/>
      <stop offset="100%" stop-color="#C4A7FF"/>
    </linearGradient>
    <clipPath id="logoClip">
      <rect x="72" y="56" width="88" height="88" rx="20"/>
